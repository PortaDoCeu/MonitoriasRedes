# Mosquitto do projeto (ADR-013, ajustado para várias bancadas pela ADR-030).
# Rode a partir da pasta Projeto_Planta_MQTT:
#     mosquitto -c broker/mosquitto.conf -v
# Os arquivos senhas e acl são gerados por: python broker/criar_usuarios.py

per_listener_settings false
allow_anonymous false
password_file broker/senhas
acl_file broker/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# MQTT puro: gateways e middlewares dos grupos (rede do laboratório).
# Numa bancada única, troque por "listener 1883 127.0.0.1" (ADR-013).
listener 1883

# MQTT sobre WebSocket: app no navegador dos celulares.
listener 9001
protocol websockets
